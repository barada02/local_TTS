<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16271f"/>
      <stop offset="1" stop-color="#060a08"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bf5a8"/>
      <stop offset="1" stop-color="#1fb066"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="14" y="14" width="996" height="996" rx="214" fill="none" stroke="#34d27b" stroke-opacity="0.35" stroke-width="8"/>
  <!-- a sound wave drawn as five bars: the tallest one is the winner -->
  <rect x="160" y="382" width="96" height="260" rx="48" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="312" y="252" width="96" height="520" rx="48" fill="#ffffff"/>
  <rect x="464" y="162" width="96" height="700" rx="48" fill="url(#green)"/>
  <rect x="616" y="302" width="96" height="420" rx="48" fill="#ffffff"/>
  <rect x="768" y="362" width="96" height="300" rx="48" fill="#ffffff" fill-opacity="0.92"/>
</svg>
