[package]
name = "tts-bench"
version = "0.1.0"
description = "Try local text-to-speech models: voices, speed and quality"
authors = ["barada02"]
edition = "2024"

[lib]
name = "tts_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2"] }
fs4 = { version = "0.13", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
# Phonon text-to-speech runtime (pure Rust). Pinned, along with its tensor
# library, to releases at least two weeks old; update them together.
ptts = { version = "=0.5.0", features = ["hf"] }
xn = "=0.2.12"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

# The voice's tensor math is far too slow unoptimized, so build it optimized
# even in `tauri dev` (debug) builds.
[profile.dev.package]
ptts = { opt-level = 3 }
xn = { opt-level = 3 }
xn-gemm = { opt-level = 3 }
xn-gemm-common = { opt-level = 3 }
xn-gemm-f32 = { opt-level = 3 }
pulp = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
